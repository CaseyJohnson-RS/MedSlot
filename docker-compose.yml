name: medslot

services:
  api:
    build:
      context: .
      dockerfile: src/MedSlot.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=medslot;Username=medslot;Password=medslot
      Kafka__BootstrapServers: kafka:29092
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # Воркеры: у каждого своя база (создаётся при первом запуске) и своя группа консьюмеров.
  notifications-worker:
    build:
      context: .
      dockerfile: deploy/worker.Dockerfile
      args:
        WORKER: Notifications
    environment:
      ConnectionStrings__Notifications: Host=postgres;Port=5432;Database=medslot_notifications;Username=medslot;Password=medslot
      # Только чтение контактов пациента (ADR 0010).
      ConnectionStrings__Clinic: Host=postgres;Port=5432;Database=medslot;Username=medslot;Password=medslot
      Kafka__BootstrapServers: kafka:29092
      Smtp__Host: mailpit
      Smtp__Port: 1025
    depends_on:
      api:
        condition: service_started
      mailpit:
        condition: service_started
    restart: unless-stopped

  audit-worker:
    build:
      context: .
      dockerfile: deploy/worker.Dockerfile
      args:
        WORKER: Audit
    environment:
      ConnectionStrings__Audit: Host=postgres;Port=5432;Database=medslot_audit;Username=medslot;Password=medslot
      Kafka__BootstrapServers: kafka:29092
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  # Почтовый сервер для разработки: письма не уходят наружу, видны в веб-интерфейсе.
  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - "8025:8025"
      - "1025:1025"

  postgres:
    image: postgres:18.6-alpine
    environment:
      # Только для локальной разработки.
      POSTGRES_DB: medslot
      POSTGRES_USER: medslot
      POSTGRES_PASSWORD: medslot
    ports:
      - "5432:5432"
    volumes:
      # Начиная с Postgres 18 данные лежат в /var/lib/postgresql/<версия>/docker.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medslot -d medslot"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:4.3.2
    environment:
      # Один узел в режиме KRaft: брокер и контроллер в одном процессе.
      # ID кластера — UUID в base64 (22 символа); для локального стенда фиксированный.
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL — для контейнеров (kafka:29092), EXTERNAL — для хоста (localhost:9092).
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Топики создаются явно, опечатка в имени не должна молча создавать новый топик.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    environment:
      KAFKA_CLUSTERS_0_NAME: medslot
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports:
      - "8081:8080"
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  postgres-data:
  kafka-data:
